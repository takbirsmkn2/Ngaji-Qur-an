<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ngaji Qur'an – Belajar Membaca Al-Qur'an dari Nol</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8f1;--sf:#fff;--tx:#14261c;--mu:#4b5f53;--pr:#0f6b45;--pt:#fff;--ac:#e8b923;--bd:#cfdccf;--ok:#0f6b45;--wr:#a35a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a14;--sf:#17271f;--tx:#eef5ee;--mu:#a9bcaf;--pr:#52c48d;--pt:#06180f;--bd:#2c4437;--ok:#52c48d;--wr:#f0b45a}}
:root[data-theme=dark]{--bg:#0e1a14;--sf:#17271f;--tx:#eef5ee;--mu:#a9bcaf;--pr:#52c48d;--pt:#06180f;--bd:#2c4437;--ok:#52c48d;--wr:#f0b45a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 Nunito,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--pr);color:var(--pt)}
header img{width:48px;height:48px;border-radius:8px;background:#fff;padding:2px}
header b{font-size:20px;display:block;line-height:1.1}header small{opacity:.9}
.wrap{display:flex;min-height:calc(100vh - 70px)}
nav{display:flex;flex-direction:column;gap:4px;padding:10px;width:220px;flex:none;background:var(--sf);border-right:1px solid var(--bd)}
nav button{all:unset;cursor:pointer;padding:12px 14px;border-radius:10px;font-weight:700;color:var(--tx)}
nav button:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
nav button.on{background:var(--pr);color:var(--pt)}
main{flex:1;padding:18px;max-width:900px;margin:0 auto;width:100%;min-width:0}
h1{font-size:28px;margin:.2em 0 .4em}h2{font-size:22px;margin:1em 0 .4em}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.btn{all:unset;cursor:pointer;display:inline-block;padding:13px 20px;border-radius:12px;background:var(--pr);color:var(--pt);font-weight:800;text-align:center;margin:4px 4px 4px 0}
.btn.s{background:transparent;color:var(--pr);border:2px solid var(--pr)}
.btn.big{font-size:22px;padding:18px 30px}
.ar{font-family:Amiri,'Traditional Arabic',serif;direction:rtl;line-height:1.9}
.L{all:unset;cursor:pointer;text-align:center;border:1px solid var(--bd);border-radius:12px;padding:8px;background:var(--sf)}
.L .ar{font-size:44px;display:block}.L small{display:block}.L.d{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.big-ar{font-size:var(--sz,64px)}
.chip{all:unset;cursor:pointer;display:inline-block;margin:3px;padding:2px 10px;border:1px solid var(--bd);border-radius:10px;font-size:var(--sz2,36px)}
.bar{height:16px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{margin:0}
.mu{color:var(--mu)}.ok{color:var(--ok)}.wr{color:var(--wr)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--pr),#1b8a5a);color:var(--pt);border-radius:18px;padding:20px}
.hero img{width:120px;height:120px;background:#fff;border-radius:50%;padding:6px;flex:none}
.hero .btn{background:var(--ac);color:#2a2000}
.opt{all:unset;cursor:pointer;display:block;width:100%;border:2px solid var(--bd);border-radius:12px;padding:12px;margin:6px 0;background:var(--sf)}
.opt.g{border-color:var(--ok)}.opt.b{border-color:#c0392b}
table{border-collapse:collapse;width:100%;font-size:16px}td,th{border-bottom:1px solid var(--bd);padding:8px;text-align:left}
input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);max-width:100%}
.ach{opacity:.45}.ach.on{opacity:1}
@media(max-width:760px){.wrap{display:block}nav{flex-direction:row;overflow-x:auto;width:100%;border-right:0;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}nav button{white-space:nowrap;padding:12px}.hero img{width:90px;height:90px}}
#pbw{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:2px solid var(--pr);z-index:20;font-size:15px}#pbw span{flex:1}#pb.wr{color:var(--wr)}#pb.ok{color:var(--ok)}main{padding-bottom:100px}
</style></head><body>

<script>
const $=id=>document.getElementById(id);
const def={name:"",lv:1,done:{},q:{},days:[],mins:{},ach:{},lan:0,set:{sz:64,rate:.9,style:'mt'},st:{},students:[]};
let S=def;try{S=Object.assign({},def,JSON.parse(localStorage.getItem('ngaji')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ngaji',JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
function act(){if(!S.days.includes(today())){S.days.push(today())}save()}
function streak(){let n=0,d=new Date();while(S.days.includes(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const Aud=new Audio();Aud.preload='auto';const PL={id:0};
function setStat(t,c){const e=$('pb');if(e){e.textContent=t;e.className=c||''}}
function stopAll(){PL.id++;try{Aud.pause()}catch(e){}try{speechSynthesis.cancel()}catch(e){}}
function urls(no,a){const p=String(no).padStart(3,'0')+String(a).padStart(3,'0')+'.mp3',E='https://everyayah.com/data/',M=E+'Husary_Muallim_128kbps/'+p,H=E+'Husary_128kbps/'+p,Q='https://verses.quran.com/Husary/mp3/'+p;return S.set.style=='mu'?[M,H,Q]:[H,Q,M]}
function playUrl(list,id){return new Promise(res=>{let k=0;const next=()=>{if(id!=PL.id)return res('x');if(k>=list.length)return res(false);let h=0;const fail=()=>{if(!h){h=1;next()}};Aud.onended=()=>{if(id==PL.id)res(true)};Aud.onerror=fail;Aud.src=list[k++];Aud.defaultPlaybackRate=S.set.rate;Aud.playbackRate=S.set.rate;const p=Aud.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name=='AbortError')return;fail()})};next()})}
Aud.onplaying=()=>{const e=$('pb');if(e)e.textContent=e.textContent.replace('memuat...','memutar')};
async function ay(si,j,rep){stopAll();const id=PL.id,s=SUR[si];for(let r=0;r<(rep||1);r++){setStat('🔊 Syekh Al-Husary · '+s.n+' ayat '+(j+1)+(rep?' ('+(r+1)+'/'+rep+')':'')+' · memuat...','ok');const ok=await playUrl(urls(s.no,j+1),id);if(ok==='x')return;if(!ok){setStat('⚠ Rekaman Al-Husary tidak dapat dimuat (periksa internet, atau halaman ini memblokir audio luar; coba berkas unduhan). Memakai suara perangkat.','wr');tts(s.a[j]);return}}setStat('✓ Selesai diputar · '+s.n+' ayat '+(j+1),'ok');return true}
function tts(t){try{const ss=speechSynthesis;ss.cancel();const u=new SpeechSynthesisUtterance(t);const v=ss.getVoices().find(v=>/^ar/i.test(v.lang));if(v){u.voice=v;u.lang=v.lang}else{u.lang='ar-SA';setStat('⚠ Perangkat ini tidak punya suara Arab, jadi suara mungkin tidak keluar. Pasang suara Arab di pengaturan Text-to-Speech perangkat.','wr')}u.rate=Math.min(1,S.set.rate);setTimeout(()=>ss.speak(u),80)}catch(e){setStat('⚠ Browser tidak mendukung suara.','wr')}}
function sp(t){stopAll();setStat('🔈 Suara perangkat (rekaman Al-Husary tersedia untuk ayat Al-Qur\'an)','');tts(t)}
function tj(i){const t=TJ[i][4],m=t.match(/\(([^:]+): (\d+)\)/);const si=m?SUR.findIndex(s=>s.n==m[1]):-1;if(si>=0)ay(si,+m[2]-1);else sp(t.split(' (')[0])}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
const LET="ا|Alif|rongga mulut (Al-Jauf), huruf mad;ب|Ba|dua bibir bertemu;ت|Ta|ujung lidah menyentuh pangkal gigi seri atas;ث|Tsa|ujung lidah di ujung gigi seri atas, desis lembut;ج|Jim|tengah lidah menyentuh langit-langit;ح|Ha|tengah tenggorokan, napas tipis;خ|Kha|ujung tenggorokan, bunyi menggesek;د|Dal|ujung lidah di pangkal gigi seri atas;ذ|Dzal|ujung lidah di ujung gigi seri atas;ر|Ra|ujung lidah, bergetar ringan;ز|Zai|ujung lidah dekat gigi bawah, berdesis;س|Sin|ujung lidah dekat gigi bawah, desis tipis;ش|Syin|tengah lidah, desis lebar;ص|Shad|desis tebal, lidah terangkat;ض|Dhad|tepi lidah dengan geraham atas;ط|Tha|ujung lidah, tebal;ظ|Zha|ujung lidah di gigi seri, tebal;ع|'Ain|tengah tenggorokan, ditekan;غ|Ghain|ujung tenggorokan, berkumur;ف|Fa|gigi seri atas dan bibir bawah;ق|Qaf|pangkal lidah dan langit-langit lunak, tebal;ك|Kaf|pangkal lidah, agak ke depan dari Qaf;ل|Lam|tepi lidah;م|Mim|dua bibir menutup;ن|Nun|ujung lidah dan gusi atas;و|Waw|dua bibir membulat;ه|Ha|pangkal tenggorokan, napas jelas;ي|Ya|tengah lidah".split(';').map(x=>x.split('|'));
const NJ="ادذرزو";
const forms=c=>NJ.includes(c)?[c,c,c]:[c+"\u200D","\u200D"+c+"\u200D","\u200D"+c];

const HK=[["Fathah","\u064E","بَ","ba","dibaca 'a'"],["Kasrah","\u0650","بِ","bi","dibaca 'i'"],["Dhammah","\u064F","بُ","bu","dibaca 'u'"],["Fathatain","\u064B","بً","ban","bunyi 'an'"],["Kasratain","\u064D","بٍ","bin","bunyi 'in'"],["Dhammatain","\u064C","بٌ","bun","bunyi 'un'"],["Sukun","\u0652","أَبْ","ab","huruf mati, tanpa vokal"],["Tasydid","\u0651","رَبَّ","rabba","huruf dibaca dua kali (ditekan)"]];
const SAMB=[["ب + ا","بَا","ba"],["م + ا","مَا","ma"],["ك + ت + ب","كَتَبَ","kataba"],["ق + ل + م","قَلَمٌ","qalamun"],["ك + ت + ا + ب","كِتَابٌ","kitabun"],["ب + ي + ت","بَيْتٌ","baitun"],["ن + و + ر","نُورٌ","nurun"],["م + س + ج + د","مَسْجِدٌ","masjidun"],["ي + د","يَدٌ","yadun"],["ب + ا + ب","بَابٌ","babun"]];
const SUR=[

latihan(){return `<h1>Latihan Bacaan</h1><div class="card"><b>Level 2 – Harakat</b><br><button class="btn" onclick="go('L2')">Latihan harakat</button><button class="btn" onclick="go('L3')">Menyambung huruf</button></div><div class="card"><b>Latihan membaca ayat</b><br><button class="btn" onclick="go('L5')">Lancar Mengaji</button><button class="btn s" onclick="go('L4')">Surah pendek</button></div><div class="card"><button class="btn big" onclick="go('daily')">Latihan Mengaji Hari Ini</button></div>`},
tajwid(){return `<h1>Tajwid Dasar</h1><p class="mu">Pelajari satu per satu. Tidak perlu terburu-buru.</p>`+TJ.map((t,i)=>`<div class="card"><b>${t[0]}</b> ${S.done['tajwid:'+i]?'<span class="ok">✓</span>':''}<p>${t[1]}<br><span class="mu">Cara: ${t[2]}</span><br><span class="mu">Huruf: <span class="ar" style="font-size:22px">${t[3]}</span></span></p><div class="ar big-ar" style="font-size:44px">${t[4].split(' (')[0]}</div><div class="mu">${t[4].includes('(')?'('+t[4].split(' (')[1]:''}</div><button class="btn s" onclick="tj(${i})">🔊 Audio</button><button class="btn s" onclick="mark('tajwid',${i});go('tajwid')">Sudah paham</button></div>`).join('')+`<button class="btn" onclick="quiz('tajwid')">Kuis tajwid</button><p class="mu">Contoh Al-Qur'an yang disebut surah dan ayatnya berasal dari surah yang ada di aplikasi ini. Verifikasi bacaan Anda dengan guru atau mushaf.</p>`},
progress(){return `<h1>Progress Mengaji Saya</h1><div class="card">${CATS.map(c=>{const v=prog(c[0]);return `<div class="row" style="justify-content:space-between"><b>${c[1]}</b><span>${v}% · ${lbl(v)}</span></div>${bar(v)}<br>`}).join('')}</div><div class="card">💡 ${rec()}</div><div class="card">🔥 Streak: ${streak()} hari · Hari belajar: ${S.days.length}</div><div class="card"><small class="mu">Skala: 0–59 Perlu bimbingan · 60–74 Mulai berkembang · 75–89 Baik · 90–100 Sangat baik</small></div>`},
setoran(){return `<h1>Setoran Bacaan</h1><div class="card"><div class="row"><select id="ss" onchange="so()">${SUR.map((s,i)=>`<option value="${i}">${s.n}</option>`).join('')}</select><select id="sa"></select></div><div id="sx"></div><button class="btn s" onclick="ay(+$('ss').value,+$('sa').value)">🔊 Dengar contoh Al-Husary</button><button class="btn" id="rb" onclick="rtog()">Mulai Rekam</button><div id="ro" class="mu"></div></div><h2>Rekaman saya</h2><div id="rl" class="mu">Belum ada rekaman.</div><p class="mu">Analisis otomatis belum tersedia di prototipe ini. Rekaman disimpan sementara di perangkat selama halaman terbuka.</p>`},
prestasi(){const A=[["🏆 Pemula Al-Qur'an",S.days.length>0],["🏆 Hafal Huruf Hijaiyah",dn('huruf')>=28],["🏆 Lancar Harakat",dn('harakat')>=8],["🏆 Lancar Membaca",S.lan>=10],["🏆 Pejuang Tahsin",dn('tahsin')>=TAHS.length],["🏆 Ahli Tajwid Dasar",dn('tajwid')>=TJ.length],["🏆 7 Hari Istiqamah",streak()>=7],["🏆 30 Hari Istiqamah",streak()>=30]];return `<h1>Prestasi</h1><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${A.map(a=>`<div class="card ach ${a[1]?'on':''}">${a[0]}<br><small>${a[1]?'Diraih':'Belum diraih'}</small></div>`).join('')}</div>`},
guru(){const me=Math.round(CATS.reduce((a,c)=>a+prog(c[0]),0)/CATS.length);const D=[["Contoh Siswa A",3,70,60,55,68],["Contoh Siswa B",5,82,74,70,77]];const rows=[[S.name||"Anda",S.lv,prog('lancar'),prog('tajwid'),prog('tahsin'),me],...D.map(d=>[d[0],d[1],d[2],d[3],d[4],d[5]]),...S.students.map(n=>[n,1,0,0,0,0])];return `<h1>Guru/Murobbi</h1>${MUR}<p class="mu">Prototipe: data kelas disimpan di perangkat ini. Data A dan B hanyalah contoh tampilan.</p><div class="card"><div class="row"><input id="ns" placeholder="Nama siswa"><button class="btn" onclick="S.students.push($('ns').value||'Siswa');save();go('guru')">Tambah siswa</button></div><div style="overflow-x:auto"><table><tr><th>Nama</th><th>Level</th><th>Kelancaran</th><th>Tajwid</th><th>Tahsin</th><th>Nilai</th><th>Progress</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td><td style="min-width:90px">${bar(r[5])}</td></tr>`).join('')}</table></div></div><div class="card"><b>Tugas & catatan</b><br><textarea id="gn" rows="3" style="width:100%" placeholder="Contoh: Ulangi Al-Ikhlas ayat 1–2, perhatikan qalqalah.">${S.st.note||''}</textarea><br><button class="btn" onclick="S.st.note=$('gn').value;save();alert('Catatan tersimpan')">Simpan catatan</button></div>`},
setting(){return `<h1>Pengaturan</h1><div class="card"><label>Nama Anda<br><input id="nm" value="${S.name}"></label><br><br><label>Ukuran tulisan Arab: <span id="szv">${S.set.sz}</span>px<br><input type="range" min="40" max="110" value="${S.set.sz}" oninput="S.set.sz=+this.value;$('szv').textContent=this.value;document.documentElement.style.setProperty('--sz',this.value+'px')"></label><br><br><label>Kecepatan audio: <span id="rv">${S.set.rate}</span><br><input type="range" min="0.3" max="1.2" step="0.1" value="${S.set.rate}" oninput="S.set.rate=+this.value;$('rv').textContent=this.value"></label><br><br><label>Gaya bacaan Al-Husary<br><select onchange="S.set.style=this.value"><option value="mt" ${S.set.style!='mu'?'selected':''}>Murattal</option><option value="mu" ${S.set.style=='mu'?'selected':''}>Mu'allim (untuk belajar)</option></select></label><br><br><button class="btn s" onclick="ay(0,0)">🔊 Tes audio Al-Husary</button><button class="btn" onclick="S.name=$('nm').value;save();go('home')">Simpan</button><button class="btn s" onclick="if(confirm('Hapus semua progress?')){localStorage.removeItem('ngaji');location.reload()}">Reset progress</button></div><p class="mu">Bacaan ayat diputar dari rekaman Syekh Al-Husary (butuh internet; sumber: everyayah.com). Huruf, harakat, dan kata memakai suara bawaan perangkat. Tekan Simpan setelah mengubah pengaturan.</p>`},
daily(){return `<h1>Latihan Mengaji Hari Ini</h1><p>Pilih durasi:</p>${[5,10,15,30].map(m=>`<button class="btn big" onclick="dstart(${m})">${m} menit</button>`).join('')}<p class="mu">Terdiri dari pemanasan huruf, harakat, kata, ayat, tajwid, dan evaluasi singkat.</p>`},
L2(){return `<h1>Level 2 – Belajar Harakat</h1><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">${HK.map((h,i)=>`<div class="card" style="text-align:center"><b>${h[0]}</b><div class="ar" style="font-size:54px">${h[2]}</div><div>${h[3]} · <small class="mu">${h[4]}</small></div><button class="btn s" onclick="sp('${h[2]}');mark('harakat',${i})">🔊</button> ${S.done['harakat:'+i]?'<span class="ok">✓</span>':''}</div>`).join('')}</div><h2>Latihan</h2>${[["بَ تَ ثَ جَ","fathah"],["بِ تِ ثِ جِ","kasrah"],["بُ تُ ثُ جُ","dhammah"]].map(r=>`<div class="card row"><span class="ar" style="font-size:44px;flex:1">${r[0]}</span><button class="btn s" onclick="sp('${r[0]}')">🔊 ${r[1]}</button></div>`).join('')}<button class="btn" onclick="quiz('harakat')">Kuis harakat</button>`},
L3(){return `<h1>Level 3 – Menyambung Huruf</h1><p class="mu">Huruf ا د ذ ر ز و tidak menyambung ke huruf sesudahnya.</p>${SAMB.map(s=>`<div class="card row"><span class="ar" style="font-size:26px">${s[0]}</span><b>=</b><span class="ar" style="font-size:48px">${s[1]}</span><span class="mu">${s[2]}</span><button class="btn s" onclick="sp('${s[1]}')">🔊</button></div>`).join('')}`},
L4(){return reader(0)},L5(){return `<h1>Lancar Mengaji</h1><div class="card"><div class="row"><select id="ms"><option>Ikuti Guru</option><option>Ikuti Audio</option><option>Saya Membaca Sendiri</option></select><select id="lt"><option value="1">Satu kata</option><option value="2">Dua kata</option><option value="3">Tiga kata</option><option value="99">Satu ayat</option></select></div></div>`+reader(0,true)},
L6(){return `<h1>Level 6 – Makhrajul Huruf</h1>${MAK.map((m,i)=>`<div class="card"><b>${m[0]}</b> ${S.done['makhraj:'+i]?'<span class="ok">✓</span>':''}<div class="ar" style="font-size:30px">${m[1]}</div><p>${m[2]}</p><div class="ar" style="font-size:34px">${m[3]}</div><button class="btn s" onclick="sp('${m[3].split(' – ')[0]}');mark('makhraj',${i})">🔊 Audio</button></div>`).join('')}<h2>Huruf yang sering tertukar</h2>${MBND.map(m=>`<div class="card"><span class="ar" style="font-size:36px">${m[0]}</span><div class="mu">${m[1]}</div></div>`).join('')}<button class="btn" onclick="quiz('makhraj')">Kuis makhraj</button>`},
L7(){return `<h1>Level 7 – Tahsin</h1><p class="mu">Materi → Contoh → Audio → Latihan → Evaluasi → Pengulangan.</p>${TAHS.map((t,i)=>`<div class="card"><b>${t[0]}</b> ${S.done['tahsin:'+i]?'<span class="ok">✓</span>':''}<p>${t[1]}</p><div class="ar" style="font-size:38px">${t[2]}</div><button class="btn s" onclick="sp('${t[2].split(' ')[0]}')">🔊 Audio</button><button class="btn s" onclick="mark('tahsin',${i});go('L7')">Sudah latihan</button></div>`).join('')}<button class="btn" onclick="quiz('tahsin')">Evaluasi tahsin</button>`},
L9(){return reader(0,false,true)},
L10(){return `<h1>Level 10 – Evaluasi Kemampuan</h1><div class="card"><b>Bagaimana kemampuan membaca Al-Qur'an Anda?</b>${["Saya belum mengenal huruf hijaiyah.|1","Saya mengenal huruf hijaiyah tetapi belum bisa membaca.|2","Saya bisa membaca tetapi masih terbata-bata.|5","Saya bisa membaca tetapi belum memahami tajwid.|8","Saya sudah bisa membaca dan ingin meningkatkan tahsin.|7"].map((o,i)=>`<button class="opt" onclick="S.lv=${o.split('|')[1]};save();alert('Level awal Anda: Level ${o.split('|')[1]}');go('home')">${'ABCDE'[i]}. ${o.split('|')[0]}</button>`).join('')}</div>`}};
function open1(n){const t=LV[n-1][2];go(t=='huruf'||t=='tajwid'?t:t)}
for(const k of ['L2','L3','L4','L5','L6','L7','L9','L10'])PAGES.push([k,'']);
let RS=0;
function reader(si,lan,mus){RS=si;setTimeout(()=>rd(si,lan,mus),0);return `<h1>${mus?'Level 9 – Mushaf Latihan':lan?'':'Level 4 – Pembacaan Dasar'}</h1>`+(mus?`<p class="mu">Mushaf latihan berisi 7 surah (Al-Fatihah di Juz 1, enam surah di Juz 30).</p>`:'')+`<div class="row"><select id="rs" onchange="rd(+this.value,${!!lan},${!!mus})">${SUR.map((s,i)=>`<option value="${i}">${s.n} (${s.j})</option>`).join('')}</select>${mus?`<label>Kecepatan <input type="range" min="0.3" max="1.2" step="0.1" value="${S.set.rate}" oninput="S.set.rate=+this.value"></label>`:''}</div><div id="rd"></div>`}
function rd(i,lan,mus){const s=SUR[i];const ch=lan?+($('lt')||{value:1}).value:1;if($('rs'))$('rs').value=i;$('rd').innerHTML=s.a.map((a,j)=>{const w=a.split(' ');const k=i+'_'+j;const chunks=[];if(lan&&ch<99){for(let x=0;x<w.length;x+=ch)chunks.push(w.slice(x,x+ch).join(' '))}else if(!lan)w.forEach(x=>chunks.push(x));return `<div class="card"><div class="ar" style="font-size:var(--sz)">${a} ﴿${j+1}﴾</div>${chunks.length?`<div>${chunks.map(c=>`<button class="chip ar" onclick="sp('${c}')">${c}</button>`).join('')}</div>`:''}<p class="mu">${s.t[j]}</p><button class="btn s" onclick="ay(${i},${j})">🔊 Audio Al-Husary</button><button class="btn s" onclick="ay(${i},${j},3)">🔁 Ulangi 3×</button>${lan?`<button class="btn s" onclick="lan('${a}',${i},${j})">Saya Membaca</button>`:''}<button class="btn s" onclick="S.st['${k}']='l';mark('lancar','${k}');rd(${i},${!!lan},${!!mus})">Sedang dipelajari</button><button class="btn s" onclick="S.st['${k}']='m';mark('lancar','${k}');rd(${i},${!!lan},${!!mus})">Sudah dikuasai</button> <span class="${S.st[k]=='m'?'ok':'wr'}">${S.st[k]=='m'?'✓ Dikuasai':S.st[k]=='l'?'● Dipelajari':''}</span></div>`}).join('')}
function rep(a){let n=0;const f=()=>{if(n++<3){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(a);u.lang='ar-SA';u.rate=S.set.rate;u.onend=f;speechSynthesis.speak(u)}catch(e){}}};f()}
async function lan(a,i,j){const m=$('ms')?$('ms').value:'';const d=document.createElement('div');d.className='card';d.innerHTML='<b id="lm">Menyimak...</b><div id="lb" style="display:none"><br><button class="btn s" onclick="fb(this,1)">Lancar</button><button class="btn s" onclick="fb(this,2)">Masih terbata</button><button class="btn s" onclick="fb(this,3)">Perlu ulang</button></div>';$('rd').prepend(d);
if(m!='Saya Membaca Sendiri'){const ok=await ay(i,j);if(m=='Ikuti Guru'&&ok){let n=Math.max(3,Math.ceil((Aud.duration||5)/S.set.rate));const tx=()=>'🎙 Giliran Anda: bacalah ayat tadi ('+n+')';$('lm').textContent=tx();await new Promise(r=>{const t=setInterval(()=>{n--;if(!$('lm')||n<=0){clearInterval(t);r()}else $('lm').textContent=tx()},1000)})}}
if($('lm')){$('lm').textContent='Bagaimana bacaan Anda?';$('lb').style.display='block'}}
function fb(b,t){if(t==1){S.lan++;act()}b.parentNode.innerHTML=t==1?'<span class="ok">✓ Kelancaran membaca semakin baik. Lanjutkan ke bagian berikutnya.</span>':t==2?'<span class="wr">⚠ Tidak apa-apa. Ulangi pelan-pelan, kata demi kata.</span>':'<span class="wr">⚠ Dengarkan contoh sekali lagi, lalu ikuti perlahan.</span>';save()}
function hl(i){const l=LET[i];const f=forms(l[0]);$('det').innerHTML=`<div class="card" style="text-align:center"><div class="ar" style="font-size:120px;line-height:1.3">${l[0]}</div><h2 style="margin:0">${l[1]}</h2><p>Awal / tengah / akhir: <span class="ar" style="font-size:42px">${f.map(x=>'ـ'==x?x:x).join(' &nbsp; ')}</span></p><p><b>Makhraj:</b> ${l[2]}.</p><p class="mu">Contoh pengucapan: <span class="ar" style="font-size:30px">${l[0]}َ ${l[0]}ِ ${l[0]}ُ</span></p><button class="btn" onclick="sp('${l[0]=='ا'?'أَ':l[0]+'َ'}')">🔊 Dengarkan</button><button class="btn s" onclick="hc(${i})">Saya Coba</button><button class="btn s" onclick="sp('${l[0]=='ا'?'أَ':l[0]+'َ'}')">🔁 Ulangi</button><div id="hf" class="ok"></div></div>`;scrollTo(0,0)}
function hc(i){mark('huruf',i);$('hf').textContent='Ucapkan huruf tadi sekarang. Bagus, huruf ini ditandai sudah dipelajari ✓';const b=document.querySelectorAll('.L')[i];if(b)b.classList.add('d')}
let curQ;function quiz(c){let Q;if(c=='huruf'){Q=[...Array(5)].map(()=>{const l=rnd(LET);const o=[l[1]];while(o.length<3){const x=rnd(LET)[1];if(!o.includes(x))o.push(x)}return[`<span class="ar" style="font-size:70px">${l[0]}</span><br>Huruf apa ini?`,o,0]})}else if(c=='harakat'){Q=[...Array(5)].map(()=>{const l=rnd(LET.slice(1,24));const h=rnd([["َ","a"],["ِ","i"],["ُ","u"]]);const o=["a","i","u"];return[`<span class="ar" style="font-size:70px">${l[0]+h[0]}</span><br>Bunyi harakatnya?`,o,o.indexOf(h[1])]})}else Q=QB[c];curQ={c,Q,i:0,s:0};qr()}
function qr(){const q=curQ;if(q.i>=q.Q.length){const v=Math.round(q.s/q.Q.length*100);S.q[q.c]=Math.max(S.q[q.c]||0,v);act();return R(`<h1>Hasil kuis</h1><div class="card"><h2>Skor ${v} – ${lbl(v)}</h2>${bar(v)}<p>${v>=75?'Masya Allah, bagus sekali!':'Tidak apa-apa. Ulangi materinya pelan-pelan, Anda pasti bisa.'}</p><button class="btn" onclick="quiz('${q.c}')">Ulangi kuis</button><button class="btn s" onclick="go('progress')">Lihat progress</button></div>`)}
const it=q.Q[q.i];const idx=it[1].map((_,k)=>k).sort(()=>Math.random()-.5);R(`<h1>Kuis (${q.i+1}/${q.Q.length})</h1><div class="card"><p>${it[0]}</p>${idx.map(k=>`<button class="opt" onclick="qa(this,${k==it[2]})">${it[1][k]}</button>`).join('')}</div>`)}
function qa(b,ok){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add(ok?'g':'b');if(ok)curQ.s++;setTimeout(()=>{curQ.i++;qr()},900)}
let MR,CH,RL=[];
async function rtog(){const b=$('rb');if(MR&&MR.state=='recording'){MR.stop();return}try{const st=await navigator.mediaDevices.getUserMedia({audio:true});CH=[];MR=new MediaRecorder(st);MR.ondataavailable=e=>CH.push(e.data);MR.onstop=()=>{st.getTracks().forEach(t=>t.stop());const u=URL.createObjectURL(new Blob(CH));RL.push([SUR[$('ss').value].n+' ayat '+(+$('sa').value+1),u]);b.textContent='Mulai Rekam';$('ro').textContent='Rekaman Anda telah tersimpan dan siap diperiksa oleh guru.';$('rl').innerHTML=RL.map(r=>`<div class="card">${r[0]}<br><audio controls src="${r[1]}"></audio></div>`).join('');act()};MR.start();b.textContent='⏹ Berhenti';$('ro').textContent='Merekam... bacalah dengan tenang.'}catch(e){$('ro').textContent='Mikrofon tidak dapat diakses. Izinkan akses mikrofon di browser.'}}
function so(){const s=SUR[$('ss').value];$('sa').innerHTML=s.a.map((_,j)=>`<option value="${j}">Ayat ${j+1}</option>`).join('');$('sx').innerHTML=`<div class="ar" style="font-size:var(--sz)" id="sar"></div>`;$('sa').onchange=()=>$('sar').textContent=s.a[$('sa').value];$('sar').textContent=s.a[0]}
let D;function dstart(m){const n={5:1,10:2,15:3,30:5}[m];D={m,n,st:0};dr()}

let c='';const n=D.n;if(D.st==0)c=[...Array(n+2)].map(()=>{const l=rnd(LET);return `<button class="chip ar" onclick="sp('${l[0]=='ا'?'أَ':l[0]+'َ'}')">${l[0]} ${l[1]}</button>`}).join('');
if(D.st==1)c=[...Array(n+1)].map(()=>{const l=rnd(LET.slice(1,24))[0];const t=['َ','ِ','ُ'].map(h=>l+h).join(' ');return `<button class="chip ar" onclick="sp('${t}')">${t}</button>`}).join('');
